name: Build Pooltool APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      # GitHub's Ubuntu runner already includes the Android SDK.
      # Do not use android-actions/setup-android here: its default
      # "tools" package request fails on current SDK repositories.
      - name: Accept Android SDK licenses and install required packages
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Download source ZIP
        env:
          SOURCE_URL: "https://www.bulkshare.cloud/api/anonymous-download?id=Iec_HAnSmV"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors "$SOURCE_URL" -o source.zip
          file source.zip
          unzip -tq source.zip
          mkdir source
          unzip -q source.zip -d source

      - name: Locate Android project
        id: project
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/source" -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Không tìm thấy settings.gradle hoặc settings.gradle.kts trong ZIP."
            echo "Kiểm tra lại cấu trúc file ZIP tải từ BulkShare."
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Generate missing debug keystore
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          keytool -genkeypair -v \\
            -keystore debug.keystore \\
            -storepass android \\
            -alias androiddebugkey \\
            -keypass android \\
            -dname "CN=Android Debug,O=Android,C=US" \\
            -keyalg RSA \\
            -keysize 2048 \\
            -validity 10000

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pooltool-debug-apk
          path: ${{ steps.project.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
